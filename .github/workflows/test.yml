name: Test

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13", "3.14"]

    steps:
    - uses: actions/checkout@v5

    - name: Install uv
      uses: astral-sh/setup-uv@v6
      with:
        version: "latest"
        python-version: ${{ matrix.python-version }}

    - name: Install dependencies
      run: uv sync --all-extras

    - name: Run unit tests
      run: uv run pytest

  package:
    # The wheel carries the compressed data and runs without the location extra.
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v5
      with:
        fetch-depth: 0

    - name: Install uv
      uses: astral-sh/setup-uv@v6
      with:
        version: "latest"
        python-version: "3.12"

    - name: Build
      run: uv build

    - name: Smoke test the wheel in a clean environment
      run: |
        uv venv /tmp/wheel-env
        uv pip install --python /tmp/wheel-env dist/*.whl
        /tmp/wheel-env/bin/phasmid-profile-gen generate --os linux --seed 0a1b2c3d4e5f60718293a4b5c6d7e8f9 --timezone UTC -o /tmp/linux.json
        /tmp/wheel-env/bin/phasmid-profile-gen generate --os windows --timezone Europe/Berlin -o /tmp/windows.json
        /tmp/wheel-env/bin/phasmid-profile-gen validate /tmp/linux.json
        /tmp/wheel-env/bin/phasmid-profile-gen validate /tmp/windows.json
        /tmp/wheel-env/bin/phasmid-profile-gen gpus
